<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Anton";src:url(node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2)}
@font-face{font-family:"Inter";font-weight:800;src:url(node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2)}
@font-face{font-family:"Inter";font-weight:600;src:url(node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2)}
@font-face{font-family:"SG";font-weight:700;src:url(node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-700-normal.woff2)}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
const W=1920,H=1080,CX=960,CY=540,DURATION=36.5;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const COL={bg:'#07041a',red:'#ff2e63',orange:'#ff8a1f',yellow:'#ffe14d',cyan:'#19e3ff',violet:'#8b5cff',pink:'#ff4fd8',white:'#ffffff'};

// ---------- math ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const eOut=k=>1-Math.pow(1-k,3);
const eOut5=k=>1-Math.pow(1-k,5);
const eIn=k=>k*k*k;
const eExpo=k=>k>=1?1:1-Math.pow(2,-10*k);
const eInOut=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const eBack=k=>{const c1=2.2,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
const eElastic=k=>k===0?0:k===1?1:Math.pow(2,-10*k)*Math.sin((k*10-0.75)*(2*Math.PI)/3)+1;
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const TAU=Math.PI*2, GA=2.399963229728653;
const nz=(x,s)=>Math.sin(x*1.7+s)*0.5+Math.sin(x*3.1+s*2.3)*0.3+Math.sin(x*7.3+s*5.1)*0.2;

// ---------- sprites ----------
function particleSprite(base,mid,dark,sign,size=512){
  const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');const h=size/2,r=size*0.25;
  let gr=g.createRadialGradient(h,h,r*0.6,h,h,h);
  gr.addColorStop(0,base+'aa');gr.addColorStop(0.35,base+'33');gr.addColorStop(1,base+'00');
  g.fillStyle=gr;g.fillRect(0,0,size,size);
  gr=g.createRadialGradient(h-r*0.35,h-r*0.4,r*0.05,h,h,r);
  gr.addColorStop(0,'#ffffff');gr.addColorStop(0.18,mid);gr.addColorStop(0.62,base);gr.addColorStop(1,dark);
  g.fillStyle=gr;g.beginPath();g.arc(h,h,r,0,TAU);g.fill();
  if(sign){g.fillStyle='rgba(255,255,255,0.95)';const L=r*0.95,T=r*0.24;
    g.fillRect(h-L/2,h-T/2,L,T); if(sign==='+')g.fillRect(h-T/2,h-L/2,T,L);}
  return c;
}
const SPR={
  p:particleSprite(COL.red,'#ff9aa8','#7a0626','+'),
  pn:particleSprite(COL.red,'#ff9aa8','#7a0626',null,256),
  e:particleSprite(COL.cyan,'#b8fbff','#04507a','−'),
  n:particleSprite('#8f86c9','#d8d3ff','#2e2860',null),
  w:particleSprite('#ffffff','#ffffff','#9aa0c0',null,256),
};
function spr(s,x,y,r,a=1){if(a<=0||r<=0)return;ctx.globalAlpha=a;ctx.drawImage(s,x-r*2,y-r*2,r*4,r*4);ctx.globalAlpha=1;}

// ---------- moon texture ----------
const MOON=(()=>{const s=1400,c=document.createElement('canvas');c.width=c.height=s;const g=c.getContext('2d');const R=rng(11);
  g.fillStyle='#a9a8b4';g.fillRect(0,0,s,s);
  for(let i=0;i<90;i++){const x=R()*s,y=R()*s,r=90+R()*300,l=R()<.45;const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,l?'rgba(255,255,255,0.13)':'rgba(40,38,62,0.2)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r);}
  for(let m=0;m<12;m++){const mx=R()*s,my=R()*s;for(let i=0;i<14;i++){const x=mx+(R()-.5)*320,y=my+(R()-.5)*220,r=50+R()*120;
    const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(70,66,96,0.45)');gr.addColorStop(0.7,'rgba(70,66,96,0.25)');gr.addColorStop(1,'rgba(70,66,96,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r);}}
  for(let i=0;i<900;i++){const r=Math.pow(R(),5)*85+2,x=R()*s,y=R()*s;
    g.fillStyle='rgba(55,52,78,0.16)';g.beginPath();g.arc(x,y,r,0,TAU);g.fill();
    g.fillStyle='rgba(30,28,48,0.14)';g.beginPath();g.arc(x+r*0.18,y+r*0.18,r*0.8,0,TAU);g.fill();
    g.lineWidth=Math.max(1,r*0.16);g.strokeStyle='rgba(255,255,255,0.2)';g.beginPath();g.arc(x,y,r,Math.PI*0.85,Math.PI*1.85);g.stroke();
    g.strokeStyle='rgba(20,18,36,0.16)';g.beginPath();g.arc(x,y,r,-Math.PI*0.15,Math.PI*0.85);g.stroke();
    if(r>30&&R()<.5){for(let k=0;k<10;k++){const a=R()*TAU,l=r*(1.5+R()*2);g.strokeStyle='rgba(255,255,255,0.07)';g.lineWidth=2;g.beginPath();g.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();}}}
  const id=g.getImageData(0,0,s,s),d=id.data;for(let i=0;i<d.length;i+=4){const n=(R()-.5)*22;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}g.putImageData(id,0,0);
  return c;})();
function drawMoon(x,y,r,t,a=1,o={}){
  if(a<=0)return;ctx.save();ctx.globalAlpha=a;
  // halo
  let gr=ctx.createRadialGradient(x,y,r*0.9,x,y,r*1.6);gr.addColorStop(0,'rgba(140,170,255,0.35)');gr.addColorStop(1,'rgba(140,120,255,0)');
  ctx.fillStyle=gr;ctx.fillRect(x-r*1.6,y-r*1.6,r*3.2,r*3.2);
  ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.clip();
  const span=1000,off=(o.drift??t*14)%380;
  ctx.drawImage(MOON,100+off,200,span,span,x-r,y-r,2*r,2*r);
  if(o.tint){ctx.fillStyle=o.tint;ctx.fillRect(x-r,y-r,2*r,2*r);}
  gr=ctx.createRadialGradient(x-r*0.4,y-r*0.45,r*0.05,x-r*0.1,y-r*0.1,r*1.35);
  gr.addColorStop(0,'rgba(255,255,255,0.18)');gr.addColorStop(0.45,'rgba(0,0,0,0)');gr.addColorStop(0.8,'rgba(10,0,40,0.55)');gr.addColorStop(1,'rgba(5,0,20,0.9)');
  ctx.fillStyle=gr;ctx.fillRect(x-r,y-r,2*r,2*r);
  ctx.globalCompositeOperation='lighter';
  gr=ctx.createLinearGradient(x-r,y-r,x+r,y+r);gr.addColorStop(0,'rgba(25,227,255,0.18)');gr.addColorStop(0.5,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(255,46,99,0.22)');
  ctx.fillStyle=gr;ctx.fillRect(x-r,y-r,2*r,2*r);
  ctx.restore();
}

// ---------- background ----------
const STARS=(()=>{const R=rng(3),a=[];for(let i=0;i<420;i++)a.push({x:R()*W,y:R()*H,z:0.2+R()*0.8,s:R()<.08?2.6:1.3+R(),ph:R()*TAU,sp:1+R()*3});return a;})();
function bg(t,cA,cB,camx=0,camy=0,starA=1){
  ctx.fillStyle=COL.bg;ctx.fillRect(0,0,W,H);
  const n=(px,py,r,c,a)=>{const g=ctx.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,c+a);g.addColorStop(1,c+'00');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);};
  n(W*0.22+Math.sin(t*0.3)*120,H*0.25+Math.cos(t*0.25)*80,950,cA,'55');
  n(W*0.82+Math.cos(t*0.27)*120,H*0.8+Math.sin(t*0.33)*80,900,cB,'4a');
  for(const s of STARS){const x=((s.x+camx*s.z)%W+W)%W,y=((s.y+camy*s.z)%H+H)%H;
    ctx.globalAlpha=starA*(0.35+0.65*(0.5+0.5*Math.sin(t*s.sp+s.ph)))*s.z;ctx.fillStyle='#fff';ctx.fillRect(x,y,s.s,s.s);}
  ctx.globalAlpha=1;
}
function vignette(){const g=ctx.createRadialGradient(CX,CY,H*0.35,CX,CY,H*1.05);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.7)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}

// ---------- text ----------
function kText(str,x,y,size,tl,o={}){
  if(tl<0)return;
  const outT=o.outT??-1; if(outT>0.6)return;
  ctx.save();
  const font=o.font||'Anton',weight=o.weight||'400';
  ctx.font=`${weight} ${size}px "${font}"`;ctx.textBaseline='middle';
  const ls=(o.ls||0)*size,chars=[...str],ws=chars.map(c=>ctx.measureText(c).width);
  const total=ws.reduce((a,b)=>a+b,0)+ls*(chars.length-1);
  let cx=o.align==='left'?x:o.align==='right'?x-total:x-total/2;
  const st=o.stagger??0.035,dur=o.dur??0.4;
  let fill=o.color||'#fff';
  if(o.grad){const g=ctx.createLinearGradient(0,y-size/2,0,y+size/2);g.addColorStop(0,o.grad[0]);g.addColorStop(1,o.grad[1]);fill=g;}
  if(o.box){const k=eOut(clamp(tl/0.35))*(1-eIn(clamp(outT/0.3)));const pad=size*0.35;
    ctx.fillStyle=o.box;ctx.globalAlpha=o.boxA??1;
    const bx=cx-pad,bw=(total+pad*2)*k;ctx.fillRect(bx,y-size*0.68,bw,size*1.3);ctx.globalAlpha=1;}
  let sc=1,sa=1;
  if(o.stamp){const k=clamp(tl/0.22);sc=lerp(o.stampFrom||2.4,1,eOut(k));sa=clamp(k*3);}
  const jit=o.shake||0;
  for(let i=0;i<chars.length;i++){
    const p=clamp((tl-i*st)/dur),q=outT>0?clamp((outT-i*st*0.5)/0.28):0;
    if(o.stamp?sa<=0:p<=0){cx+=ws[i]+ls;continue;}
    const a=(o.stamp?sa:clamp(p*2.5))*(1-q)*(o.alpha??1);
    if(a<=0){cx+=ws[i]+ls;continue;}
    const yo=o.stamp?0:(1-eBack(p))*size*0.55;const yq=-eIn(q)*size*0.7;
    const s=o.stamp?1:lerp(0.5,1,eBack(p));
    let jx=0,jy=0;if(jit){jx=nz(tl*40+i*3,i)*jit;jy=nz(tl*37+i*5,i+9)*jit;}
    const lx=cx+ws[i]/2,ly=y+yo+yq;
    ctx.save();ctx.translate(x+(lx-x)*sc+jx,y+(ly-y)*sc+jy);ctx.scale(s*sc,s*sc);
    if(o.rot)ctx.rotate(o.rot*(1-eOut(p)));
    ctx.globalAlpha=a;
    if(o.glitch){const gx=o.glitch*(nz(tl*31+i,i)>0.2?1:0.25);ctx.globalCompositeOperation='lighter';
      ctx.fillStyle='rgba(255,40,90,0.9)';ctx.fillText(chars[i],-ws[i]/2-gx,0);ctx.fillStyle='rgba(25,227,255,0.9)';ctx.fillText(chars[i],-ws[i]/2+gx,nz(tl*13,i)*2);ctx.globalCompositeOperation='source-over';}
    if(o.glow){ctx.shadowColor=o.glow;ctx.shadowBlur=o.blur??30;}
    if(o.stroke){ctx.lineWidth=o.sw||size*0.04;ctx.strokeStyle=o.stroke;ctx.strokeText(chars[i],-ws[i]/2,0);}
    if(!o.outline){ctx.fillStyle=fill;if(o.grad)ctx.translate(0,0);ctx.fillText(chars[i],-ws[i]/2,0);}
    ctx.restore();
    cx+=ws[i]+ls;
  }
  ctx.restore();
}
function rich(parts,x,y,size,tl,o={}){ // multi-colour line, stamped
  if(tl<0)return;ctx.save();ctx.font=`${o.weight||400} ${size}px "${o.font||'Anton'}"`;ctx.textBaseline='middle';
  const gap=size*0.25,ws=parts.map(p=>ctx.measureText(p.s).width),tot=ws.reduce((a,b)=>a+b,0)+gap*(parts.length-1);
  let cx=x-tot/2;
  parts.forEach((p,i)=>{const k=clamp((tl-i*0.12)/0.3);if(k>0){ctx.save();const s=lerp(1.8,1,eOut(k));ctx.translate(cx+ws[i]/2,y);ctx.scale(s,s);ctx.globalAlpha=clamp(k*3)*(o.alpha??1);
    ctx.shadowColor=p.c;ctx.shadowBlur=35;ctx.fillStyle=p.c;ctx.fillText(p.s,-ws[i]/2,0);ctx.restore();}cx+=ws[i]+gap;});
  ctx.restore();
}

// ---------- fx ----------
function arrow(x1,y1,x2,y2,w,c,a=1){if(a<=0)return;const ang=Math.atan2(y2-y1,x2-x1),L=Math.hypot(x2-x1,y2-y1);if(L<1)return;
  ctx.save();ctx.globalAlpha=a;ctx.translate(x1,y1);ctx.rotate(ang);ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=w*1.2;
  const hl=Math.min(L*0.5,w*2.6);ctx.fillRect(0,-w/2,L-hl+1,w);ctx.beginPath();ctx.moveTo(L,0);ctx.lineTo(L-hl,-w*1.5);ctx.lineTo(L-hl,w*1.5);ctx.closePath();ctx.fill();ctx.restore();}
function ring(x,y,r,w,c,a){if(a<=0||r<=0)return;ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=c;ctx.lineWidth=w;ctx.shadowColor=c;ctx.shadowBlur=20;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.stroke();ctx.restore();}
function glowBlob(x,y,r,c,a){if(a<=0)return;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');ctx.save();ctx.globalAlpha=a;ctx.globalCompositeOperation='lighter';ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r);ctx.restore();}
function callout(x1,y1,x2,y2,k,c){if(k<=0)return;ctx.save();ctx.strokeStyle=c;ctx.lineWidth=3;ctx.shadowColor=c;ctx.shadowBlur=12;
  const mx=lerp(x1,x2,0.55);const segs=[[x1,y1,mx,y2],[mx,y2,x2,y2]];const k1=clamp(k*2),k2=clamp(k*2-1);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(lerp(x1,mx,k1),lerp(y1,y2,k1));if(k2>0)ctx.lineTo(lerp(mx,x2,k2),y2);ctx.stroke();
  ctx.fillStyle=c;ctx.beginPath();ctx.arc(x1,y1,7*clamp(k*4),0,TAU);ctx.fill();ctx.restore();}
function burst(x,y,tl,n,c,len,seed){if(tl<0||tl>0.6)return;const R=rng(seed);ctx.save();ctx.strokeStyle=c;ctx.lineCap='round';ctx.shadowColor=c;ctx.shadowBlur=10;
  for(let i=0;i<n;i++){const a=i/n*TAU+R()*0.3,k=eOut(clamp(tl/0.45)),d0=len*0.3+len*k,d1=len*0.3+len*k*0.55;ctx.globalAlpha=1-clamp(tl/0.6);ctx.lineWidth=4*(1-k)+1;
    ctx.beginPath();ctx.moveTo(x+Math.cos(a)*d1,y+Math.sin(a)*d1);ctx.lineTo(x+Math.cos(a)*d0,y+Math.sin(a)*d0);ctx.stroke();}ctx.restore();}

// ---------- shared geometry ----------
const disk=(n,R0)=>Array.from({length:n},(_,i)=>{const r=R0*Math.sqrt((i+0.5)/n),a=i*GA;return{x:Math.cos(a)*r,y:Math.sin(a)*r,r,a};});
const NUC=(()=>{const a=[];const R=rng(21);const pts=disk(12,62);pts.forEach((p,i)=>a.push({x:p.x+(R()-.5)*8,y:p.y+(R()-.5)*8,p:i%2===0,z:R()}));a.sort((u,v)=>(u.p-v.p)||(u.z-v.z));return a;})();
function orbitPt(rx,ry,rot,th){const x=Math.cos(th)*rx,y=Math.sin(th)*ry;return[x*Math.cos(rot)-y*Math.sin(rot),x*Math.sin(rot)+y*Math.cos(rot)];}
const ORB=[{rot:0,sp:2.6,ph:0},{rot:Math.PI/3,sp:-2.2,ph:2},{rot:-Math.PI/3,sp:2.0,ph:4}];
function drawAtom(x,y,S,t,o={}){
  const oa=o.orbA??1, ea=o.eA??1, na=o.nA??1, pg=o.pGlow??0;
  ctx.save();
  if(oa>0){ctx.globalAlpha=oa*0.55;ctx.strokeStyle=COL.cyan;ctx.lineWidth=2.5;ctx.shadowColor=COL.cyan;ctx.shadowBlur=12;
    ORB.forEach(ob=>{const rev=o.orbReveal??1;ctx.save();ctx.translate(x,y);ctx.rotate(ob.rot);ctx.beginPath();ctx.ellipse(0,0,330*S,105*S,0,ob.ph,ob.ph+TAU*rev);ctx.stroke();ctx.restore();});ctx.globalAlpha=1;ctx.shadowBlur=0;}
  // nucleus glow
  glowBlob(x,y,190*S*(1+pg*0.5),'rgba(255,46,99,0.55)',(0.5+pg*0.8)*(o.nucA??1));
  NUC.forEach((n,i)=>{let nx=x+n.x*S*(o.spread??1),ny=y+n.y*S*(o.spread??1);
    if(!n.p){const fl=o.nFly??0;if(fl>0){const a=Math.atan2(n.y,n.x)+i;nx+=Math.cos(a)*fl*1400;ny+=Math.sin(a)*fl*1400;}
      spr(SPR.n,nx,ny,30*S,na);}
    else{const jit=o.pJit??0;nx+=nz(t*9+i,i)*jit;ny+=nz(t*8+i*2,i+3)*jit;
      const pop=o.pPop!=null?eBack(clamp((o.pPop-i*0.03)/0.35)):1;spr(SPR.p,nx,ny,30*S*lerp(1,1.15,pg)*(pop>0?pop:0)+0.0001,(o.pA??1));
      if(pg>0)spr(SPR.w,nx,ny,26*S,pg*0.25);}
  });
  // electrons
  if(ea>0){ORB.forEach((ob,j)=>{const fly=o.eFly??0;
    for(let k=14;k>=0;k--){const th=ob.ph+(t-k*0.014)*ob.sp;const[px,py]=orbitPt(330*S,105*S,ob.rot,th);let ex=x+px,ey=y+py;
      if(fly>0){const a=Math.atan2(py,px);ex+=Math.cos(a)*fly*1600;ey+=Math.sin(a)*fly*1600;}
      if(k===0)spr(SPR.e,ex,ey,20*S,ea);else{ctx.globalAlpha=ea*(1-k/15)*0.5;ctx.fillStyle=COL.cyan;ctx.beginPath();ctx.arc(ex,ey,(12-k*0.6)*S,0,TAU);ctx.fill();ctx.globalAlpha=1;}}});}
  ctx.restore();
}
function smallAtom(x,y,s,t,seed){
  ctx.strokeStyle='rgba(25,227,255,0.55)';ctx.lineWidth=1.6;
  for(let j=0;j<2;j++){ctx.beginPath();ctx.ellipse(x,y,34*s,12*s,seed+j*1.6,0,TAU);ctx.stroke();}
  ctx.fillStyle=COL.red;ctx.beginPath();ctx.arc(x,y,7*s,0,TAU);ctx.fill();
  const th=t*3+seed*5;const[px,py]=orbitPt(34*s,12*s,seed,th);ctx.fillStyle=COL.cyan;ctx.beginPath();ctx.arc(x+px,y+py,4*s,0,TAU);ctx.fill();
}

// ---------- camera fx ----------
const SHAKES=[[0.12,10,8],[4.49,26,7],[10.55,30,7],[11.85,30,7],[13.35,40,6],[15.2,10,8],[16.0,10,8],[18.65,16,8],[23.35,12,8],[24.8,18,7],[26.55,20,8],[28.9,30,6],[29.6,14,6],[32.11,70,2.2]];
const FLASH=[[0,0.35,'#ffffff',0.6],[4.4,0.25,'#ffffff',0.7],[13.35,0.45,'#ffffff',0.9],[14.3,0.2,'#19e3ff',0.35],[18.55,0.25,'#ff2e63',0.4],[23.2,0.2,'#ffffff',0.4],[28.9,0.35,'#ffe14d',0.6],[29.5,0.25,'#ff2e63',0.5],[32.11,0.9,'#ffffff',1]];
function shakeAt(t){let x=0,y=0,r=0;for(const[t0,a,d]of SHAKES){if(t<t0)continue;const k=a*Math.exp(-(t-t0)*d);x+=nz(t*47,t0)*k;y+=nz(t*53,t0+4)*k;r+=nz(t*29,t0+7)*k*0.0008;}
  if(t>29.7&&t<32.11){const k=Math.pow(P(t,29.7,32.1),1.6)*16;x+=nz(t*61,1)*k;y+=nz(t*57,2)*k;}
  return{x,y,r};}

// ================= SCENES =================
// A 0 - 4.4 : This is the Moon / rebuilding from pure protons
const A_P=disk(230,300).map((p,i)=>{const R=rng(100+i);const a=R()*TAU;return{...p,sx:Math.cos(a)*1300,sy:Math.sin(a)*900,ta:2.35+1.75*(i/230)+R()*0.12,sw:(R()-.5)*3};});
function sceneA(t){
  const MX=CX,MY=520;

      ctx.shadowColor=COL.orange;ctx.shadowBlur=50;let g=ctx.createLinearGradient(0,-150,0,150);g.addColorStop(0,COL.yellow);g.addColorStop(1,COL.red);ctx.fillStyle=g;
      ctx.font='400 340px "Anton"';ctx.textAlign='right';ctx.fillText('10',40,0);ctx.font='400 170px "Anton"';ctx.textAlign='left';ctx.fillText('36',55,-110);ctx.restore();
      kText('× STRONGER THAN GRAVITY',CX,880,58,tl-0.1,{font:'Inter',weight:800,ls:0.1,color:'#fff',glow:COL.orange,blur:20,stagger:0.015});
      burst(CX,620,tl,26,COL.yellow,520,4);}
  }
}

// H 29.5 - 32.1 : a proton moon couldn't hold together ;  I 32.1 - 36.5 explosion
const H_P=disk(760,330).map((p,i)=>{const R=rng(500+i);const d=Math.sqrt(1-Math.min(1,(p.r/330)**2));return{...p,d,sp:(250+R()*700)*(0.4+p.r/330),ang:p.a+(R()-.5)*0.4,jx:R()*TAU,sz:11+R()*3};});
H_P.sort((a,b)=>a.d-b.d);
const CRACKS=(()=>{const R=rng(42),a=[];for(let c=0;c<16;c++){let ang=c/16*TAU+R()*0.3,x=0,y=0;const pts=[[0,0]];for(let s=0;s<9;s++){ang+=(R()-.5)*0.9;const L=25+R()*30;x+=Math.cos(ang)*L;y+=Math.sin(ang)*L;pts.push([x,y]);}a.push({pts,t0:30.6+R()*1.2});}return a;})();
function sceneH(t){
  bg(t,COL.red,'#ff5a00',-t*20,0);
  const pul=Math.max(0,Math.sin((t-29.5)*Math.PI*4))*P(t,30.4,32.1);
  ctx.save();ctx.globalAlpha=0.25*pul;ctx.fillStyle=COL.red;ctx.fillRect(0,0,W,H);ctx.restore();
  const MX=CX,MY=CY+20;const ink=eOut(P(t,29.45,29.9));const S=lerp(0.6,1,ink)*(1+P(t,29.9,32.1)*0.05);
  const jit=Math.pow(P(t,29.7,32.1),1.5)*10;
  glowBlob(MX,MY,330*S*1.6,'rgba(255,46,99,0.6)',0.7+pul*0.4);
  for(const p of H_P){const x=MX+p.x*S+nz(t*20+p.jx,p.jx)*jit,y=MY+p.y*S+nz(t*22+p.jx,p.jx+2)*jit;spr(SPR.pn,x,y,p.sz*S,lerp(0.45,1,p.d));}
  // shading for sphere depth
  ctx.save();const g=ctx.createRadialGradient(MX-90,MY-100,40,MX,MY,340*S);g.addColorStop(0,'rgba(255,255,255,0.12)');g.addColorStop(0.7,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(20,0,20,0.45)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(MX,MY,340*S,0,TAU);ctx.fill();ctx.restore();
  // cracks
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';ctx.lineJoin='round';
  for(const c of CRACKS){const k=eOut(P(t,c.t0,c.t0+0.35));if(k<=0)continue;const n=Math.max(1,Math.floor((c.pts.length-1)*k));
    for(const[lw,col,a]of[[12,COL.orange,0.5],[4,'#fff6c0',1]]){ctx.strokeStyle=col;ctx.globalAlpha=a*(0.7+0.3*Math.sin(t*40+c.t0*10));ctx.lineWidth=lw;ctx.beginPath();c.pts.slice(0,n+1).forEach(([x,y],i)=>i?ctx.lineTo(MX+x*S,MY+y*S):ctx.moveTo(MX+x*S,MY+y*S));ctx.stroke();}}
  ctx.restore();
  glowBlob(MX,MY,200*P(t,31.2,32.1),'rgba(255,240,200,0.9)',P(t,31.2,32.1));
  kText('A PROTON MOON',CX,110,96,t-29.73,{color:'#fff',glow:COL.red,blur:30,stagger:0.03});
  kText("COULDN'T HOLD TOGETHER",CX,960,104,t-30.55,{grad:[COL.yellow,COL.orange],glow:COL.red,blur:30,stagger:0.025,shake:2+P(t,30.6,32.1)*8});
}
function sceneI(t){
  const tl=t-32.11;
  bg(t,COL.orange,COL.red,-t*20,0,1);
  const MX=CX,MY=CY+20;
  // fireball
  const fk=clamp(tl/2.2);glowBlob(MX,MY,lerp(200,1300,eOut(fk)),'rgba(255,230,160,1)',(1-fk)*1.2);
  glowBlob(MX,MY,lerp(150,900,eOut(fk)),'rgba(255,90,40,1)',(1-fk)*0.9);
  for(let i=0;i<3;i++){const k=clamp((tl-i*0.12)/1.1);ring(MX,MY,eOut(k)*(1400+i*200),30*(1-k)+2,i===1?COL.cyan:i===2?COL.pink:'#fff',1-k);}
  // protons fly
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
  for(const p of H_P){const d=p.sp*(tl+0.9*tl*tl);const ca=Math.cos(p.ang),sa=Math.sin(p.ang);const x=MX+p.x+ca*d,y=MY+p.y+sa*d;
    if(x<-100||x>W+100||y<-100||y>H+100)continue;const v=p.sp*(1+1.8*tl);const L=Math.min(260,v*0.06);
    ctx.globalAlpha=0.5;ctx.strokeStyle=COL.orange;ctx.lineWidth=p.sz*0.9;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-ca*L,y-sa*L);ctx.stroke();ctx.globalAlpha=1;}
  ctx.restore();
  for(const p of H_P){const d=p.sp*(tl+0.9*tl*tl);const x=MX+p.x+Math.cos(p.ang)*d,y=MY+p.y+Math.sin(p.ang)*d;if(x<-50||x>W+50||y<-50||y>H+50)continue;spr(SPR.pn,x,y,p.sz,1);}
  kText('IT WOULD',CX,330,64,t-32.11,{font:'Inter',weight:800,ls:0.3,color:'#fff',outT:t-34.4});
  kText('BLOW ITSELF',CX,500,200,t-32.2,{stamp:true,stampFrom:3,grad:['#ffffff',COL.yellow],stroke:'#3a0010',sw:12,glow:COL.orange,blur:50,outT:t-34.4,shake:Math.max(0,1-tl/1.2)*8});
  kText('APART',CX,720,260,t-32.45,{stamp:true,stampFrom:3.4,grad:[COL.yellow,COL.red],stroke:'#3a0010',sw:14,glow:COL.red,blur:60,outT:t-34.45,shake:Math.max(0,1-tl/1.2)*10});
  kText('WHAT IF THE MOON',CX,450,120,t-34.75,{color:'#fff',glow:COL.violet,blur:30,stagger:0.03});
  kText('WERE MADE OF PROTONS?',CX,590,120,t-35.0,{grad:[COL.yellow,COL.red],glow:COL.red,blur:30,stagger:0.03});
}

const SCENES=[[0,4.4,sceneA],[4.4,6.8,sceneB],[6.8,10.4,sceneC],[10.4,14.3,sceneD],[14.3,18.55,sceneE],[18.55,23.2,sceneF],[23.2,29.5,sceneG],[29.5,32.11,sceneH],[32.11,99,sceneI]];
function hud(t,idx){
  ctx.save();ctx.globalAlpha=0.75*P(t,0.4,1);ctx.font='600 20px "Inter"';ctx.fillStyle='#fff';ctx.textBaseline='middle';
  ctx.textAlign='left';ctx.fillText('WHAT IF THE MOON WERE MADE OF PROTONS?',56,50);
  ctx.textAlign='right';ctx.font='700 22px "SG"';ctx.fillStyle=COL.yellow;ctx.fillText(String(idx+1).padStart(2,'0')+' / '+String(SCENES.length).padStart(2,'0'),W-56,50);
  ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(56,H-40,W-112,3);ctx.fillStyle=COL.red;ctx.shadowColor=COL.red;ctx.shadowBlur=10;ctx.fillRect(56,H-40,(W-112)*clamp(t/DURATION),3);
  ctx.restore();
}
function render(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.shadowBlur=0;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  let idx=SCENES.findIndex(s=>t>=s[0]&&t<s[1]);if(idx<0)idx=SCENES.length-1;
  const sh=shakeAt(t);
  // cut punch: brief zoom on each cut
  const st=SCENES[idx][0];const punch=idx>0?1+0.06*Math.exp(-(t-st)*10):1;
  ctx.save();ctx.translate(CX+sh.x,CY+sh.y);ctx.rotate(sh.r);ctx.scale(punch,punch);ctx.translate(-CX,-CY);
  SCENES[idx][2](t);
  ctx.restore();
  ctx.setTransform(1,0,0,1,0,0);
  vignette();
  for(const[t0,d,c,a]of FLASH){if(t>=t0&&t<t0+d){ctx.globalAlpha=a*(1-(t-t0)/d)**2;ctx.fillStyle=c;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}}
  hud(t,idx);
  // ending fade
  const fo=P(t,DURATION-0.6,DURATION);if(fo>0){ctx.fillStyle=`rgba(0,0,0,${fo})`;ctx.fillRect(0,0,W,H);}
}
window.render=render;window.DURATION=DURATION;
window.ready=Promise.all([document.fonts.load('400 40px "Anton"'),document.fonts.load('800 40px "Inter"'),document.fonts.load('600 40px "Inter"'),document.fonts.load('700 40px "SG"')]).then(()=>document.fonts.ready);
</script></body></html>
