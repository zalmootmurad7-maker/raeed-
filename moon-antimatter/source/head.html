<script>
const W=1920,H=1080,CX=960,CY=540,DURATION=147.5;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const BG='#f6f4f8',INK='#161616',RED='#d2382c',GREY='#a3a1a8',PAPER='#fbfafd',LW=3.4;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const eOut=k=>1-Math.pow(1-k,3);
const eIn=k=>k*k*k;
const eInOut=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const eBack=k=>{const c1=2.0,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
const TAU=Math.PI*2;
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const nz=(x,s)=>Math.sin(x*1.7+s)*0.5+Math.sin(x*3.1+s*2.3)*0.3+Math.sin(x*7.3+s*5.1)*0.2;
// pop-in scale: 0 before t0, overshoot then settle
const pop=(t,t0,d=0.22)=>t<t0?0:eBack(clamp((t-t0)/d));

// ---------------- pen ----------------
function wob(pts,seed,amp=1.4){ // subdivide + smooth perpendicular wobble
  const out=[];let s=0;
  for(let i=0;i<pts.length-1;i++){const[a,b]=[pts[i],pts[i+1]];const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1;const n=Math.max(1,Math.ceil(L/14));const px=-dy/L,py=dx/L;
    for(let j=0;j<n;j++){const k=j/n,o=nz((s+L*k)*0.025,seed)*amp;out.push([a[0]+dx*k+px*o,a[1]+dy*k+py*o]);}s+=L;}
  const l=pts[pts.length-1];out.push([l[0],l[1]]);return out;}
function strokePts(pts,k=1,w=LW,col=INK){
  if(k<=0||pts.length<2)return;ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';
  let tot=0;const L=[0];for(let i=1;i<pts.length;i++){tot+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);L.push(tot);}
  const lim=tot*clamp(k);ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++){if(L[i]<=lim)ctx.lineTo(pts[i][0],pts[i][1]);else{const f=(lim-L[i-1])/(L[i]-L[i-1]||1);ctx.lineTo(lerp(pts[i-1][0],pts[i][0],f),lerp(pts[i-1][1],pts[i][1],f));break;}}
  ctx.stroke();}
function line(x1,y1,x2,y2,seed=1,k=1,w=LW,col=INK){strokePts(wob([[x1,y1],[x2,y2]],seed,1.2),k,w,col);}
function circlePts(x,y,r,seed,ry){const R=rng(seed);const a0=R()*TAU,n=Math.max(28,Math.floor(r*0.6)),pts=[];ry=ry??r;
  for(let i=0;i<=n;i++){const a=a0+(TAU+0.18)*i/n;const rr=1+0.018*nz(a*2,seed)+(i/n)*0.012;pts.push([x+Math.cos(a)*r*rr,y+Math.sin(a)*ry*rr]);}return pts;}
function circ(x,y,r,o={}){const pts=circlePts(x,y,r,o.seed??7,o.ry);
  if(o.fill){ctx.fillStyle=o.fill;ctx.beginPath();ctx.ellipse(x,y,r,o.ry??r,0,0,TAU);ctx.fill();}
  if(o.dash)ctx.setLineDash(o.dash);strokePts(pts,o.k??1,o.w??LW,o.col??INK);ctx.setLineDash([]);}
function rect(x,y,w,h,seed=3,k=1,lw=LW,col=INK){const o=5;const R=rng(seed);const sides=[[[x-o*R(),y],[x+w+o*R(),y]],[[x+w,y-o*R()],[x+w,y+h+o*R()]],[[x+w+o*R(),y+h],[x-o*R(),y+h]],[[x,y+h+o*R()],[x,y-o*R()]]];
  sides.forEach((s,i)=>strokePts(wob(s,seed+i,1.1),clamp(k*4-i),lw,col));}
function arrow(x1,y1,x2,y2,o={}){const seed=o.seed??5,k=o.k??1,col=o.col??INK,w=o.w??LW,hs=o.head??18;
  line(x1,y1,x2,y2,seed,k,w,col);if(k<1)return;const a=Math.atan2(y2-y1,x2-x1);
  for(const s of[-1,1]){const b=a+Math.PI-s*0.5;line(x2,y2,x2+Math.cos(b)*hs,y2+Math.sin(b)*hs,seed+s+3,1,w,col);}
  if(o.both){for(const s of[-1,1]){const b=a-s*0.5;line(x1,y1,x1+Math.cos(b)*hs,y1+Math.sin(b)*hs,seed+s+9,1,w,col);}}}
function bigArrow(x1,y1,x2,y2,th,k=1,seed=11){ // hollow block arrow
  const a=Math.atan2(y2-y1,x2-x1),L=Math.hypot(x2-x1,y2-y1)*k;if(L<5)return;const hl=Math.min(th*2.2,L*0.6),c=Math.cos(a),s=Math.sin(a);
  const loc=(u,v)=>[x1+c*u-s*v,y1+s*u+c*v];
  const pts=[loc(0,-th/2),loc(L-hl,-th/2),loc(L-hl,-th*1.15),loc(L,0),loc(L-hl,th*1.15),loc(L-hl,th/2),loc(0,th/2),loc(0,-th/2)];
  ctx.fillStyle=PAPER;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.fill();
  strokePts(wob(pts,seed,1.1));}
function txt(s,x,y,size,o={}){ // handwriting, revealed letter by letter when o.k<1
  const k=o.k??1;if(k<=0)return;ctx.save();ctx.font=`${size}px "PH"`;ctx.textBaseline='middle';ctx.fillStyle=o.col??INK;
  const full=ctx.measureText(s).width;const n=Math.ceil(s.length*clamp(k));const sub=s.slice(0,n);
  let x0=o.align==='left'?x:o.align==='right'?x-full:x-full/2;
  if(o.rot){ctx.translate(x,y);ctx.rotate(o.rot);ctx.translate(-x,-y);}
  ctx.globalAlpha*=(o.a??1);ctx.fillText(sub,x0,y);ctx.restore();return full;}
const writeK=(t,t0,s,cps=26)=>t<t0?0:clamp((t-t0)*cps/Math.max(1,s.length));
function sup(base,exp,x,y,size,o={}){ctx.save();ctx.font=`${size}px "PH"`;ctx.textBaseline='middle';ctx.fillStyle=o.col??INK;const wb=ctx.measureText(base).width;ctx.font=`${size*0.55}px "PH"`;const we=ctx.measureText(exp).width;
  const x0=x-(wb+we)/2;ctx.font=`${size}px "PH"`;ctx.fillText(base,x0,y);ctx.font=`${size*0.55}px "PH"`;ctx.fillText(exp,x0+wb+2,y-size*0.38);ctx.restore();}
function scribble(x,y,w,h,seed,k,col=RED){const R=rng(seed);const pts=[];const n=9;for(let i=0;i<=n;i++){pts.push([x+w*i/n+(R()-.5)*8,y+(i%2?-h/2:h/2)+(R()-.5)*6]);}strokePts(wob(pts,seed,1),k,4,col);}
function motionLines(x,y,ang,len,n,seed,k=1){const c=Math.cos(ang),s=Math.sin(ang),R=rng(seed);for(let i=0;i<n;i++){const off=(i-(n-1)/2)*14;const l=len*(0.6+R()*0.4);
  const sx=x-c*20-s*off,sy=y-s*20+c*off;line(sx,sy,sx-c*l,sy-s*l,seed+i,k,2.6);}}
function shakeMarks(x,y,r,seed,a=1){if(a<=0)return;ctx.save();ctx.globalAlpha=a;for(const side of[-1,1]){for(let i=0;i<2;i++){const rr=r+16+i*14;const pts=[];for(let j=0;j<=8;j++){const an=(side<0?Math.PI:0)+(-0.35+0.7*j/8);pts.push([x+Math.cos(an)*rr,y+Math.sin(an)*rr]);}strokePts(wob(pts,seed+i+side*5,0.8),1,2.6);}}ctx.restore();}

// ---------------- glyphs ----------------
function proton(x,y,r,o={}){const s=o.s??1;if(s<=0)return;r*=s;circ(x,y,r,{fill:PAPER,seed:o.seed??Math.floor(x*7+y*3),w:o.w??LW});
  const c=o.plusCol??INK,q=r*0.5;line(x-q,y,x+q,y,(o.seed??1)+1,1,o.w??LW,c);line(x,y-q,x,y+q,(o.seed??1)+2,1,o.w??LW,c);}
function electron(x,y,r,o={}){const s=o.s??1;if(s<=0)return;r*=s;circ(x,y,r,{fill:PAPER,seed:o.seed??Math.floor(x*5+y*11),w:o.w??LW});
  ctx.save();ctx.font=`${r*1.5}px "PHL"`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=INK;ctx.fillText('e',x-r*0.1,y-r*0.08);ctx.font=`${r*0.9}px "PHL"`;ctx.fillText('-',x+r*0.45,y-r*0.45);ctx.restore();}
function neutron(x,y,r,o={}){const s=o.s??1;if(s<=0)return;r*=s;circ(x,y,r,{fill:'#d9d7de',seed:o.seed??Math.floor(x*3+y*13),w:o.w??LW});}
// sprite for dense proton fills
const PSPR=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');g.fillStyle=PAPER;g.strokeStyle=INK;g.lineWidth=3;g.lineCap='round';
  g.beginPath();g.arc(32,32,24,0,TAU);g.fill();g.stroke();g.beginPath();g.moveTo(20,32);g.lineTo(44,32);g.moveTo(32,20);g.lineTo(32,44);g.stroke();return c;})();
// moon texture (grey with ink craters), drawn in clip
const MOONTEX=(()=>{const s=600,c=document.createElement('canvas');c.width=c.height=s;const g=c.getContext('2d');const R=rng(31);
  g.fillStyle='#9e9ca4';g.fillRect(0,0,s,s);
  for(let i=0;i<40;i++){g.fillStyle=R()<.5?'rgba(60,58,66,0.18)':'rgba(255,255,255,0.12)';g.beginPath();g.arc(R()*s,R()*s,20+R()*70,0,TAU);g.fill();}
  g.strokeStyle='#2a2a2e';g.lineCap='round';
  for(let i=0;i<220;i++){const r=3+Math.pow(R(),2.5)*30,x=R()*s,y=R()*s;g.lineWidth=r>12?2.2:1.6;g.beginPath();g.arc(x,y,r,R()*TAU,R()*TAU+TAU*(0.6+R()*0.4));g.stroke();}
  for(let i=0;i<500;i++){g.fillStyle='rgba(30,30,34,0.5)';g.fillRect(R()*s,R()*s,2,2);}
  return c;})();
function moon(x,y,r,o={}){const s=o.s??1;if(s<=0)return;r*=s;ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.clip();ctx.drawImage(MOONTEX,x-r,y-r,r*2,r*2);ctx.restore();circ(x,y,r,{seed:o.seed??41,w:LW+0.6});}
function protonBall(x,y,r,o={}){ // moon made of protons
  const s=o.s??1;if(s<=0)return;r*=s;const pr=o.pr??15,jit=o.jit??0,t=o.t??0;ctx.save();ctx.beginPath();ctx.arc(x,y,r+pr,0,TAU);ctx.clip();
  const st=pr*1.95;let i=0;for(let yy=-r;yy<=r;yy+=st*0.87){const off=(Math.round(yy/(st*0.87))&1)*st/2;for(let xx=-r-off;xx<=r;xx+=st){i++;if(xx*xx+yy*yy>(r-pr*0.6)**2)continue;
    const jx=nz(t*18+i,i)*jit,jy=nz(t*21+i*1.3,i+4)*jit;ctx.drawImage(PSPR,x+xx+jx-pr,y+yy+jy-pr,pr*2,pr*2);}}
  ctx.restore();circ(x,y,r,{seed:o.seed??43,w:LW+0.4});}

// ---------------- stick figure ----------------
const POSES={
  rest:{la:[-0.22,-0.12],ra:[0.22,0.12],ll:[-0.28,-0.22],rl:[0.28,0.22],paper:0},
  paper:{la:[-0.22,-0.12],ra:[0.45,2.45],ll:[-0.26,-0.2],rl:[0.26,0.2],paper:1},
  point:{la:[-0.22,-0.12],ra:[2.1,2.05],ll:[-0.26,-0.2],rl:[0.26,0.2],paper:0},
  chin:{la:[-0.3,0.9],ra:[0.35,2.75],ll:[-0.24,-0.18],rl:[0.24,0.18],paper:0},
  shrug:{la:[-0.9,-2.2],ra:[0.9,2.2],ll:[-0.26,-0.2],rl:[0.26,0.2],paper:0},
  up:{la:[-2.55,-2.85],ra:[2.55,2.85],ll:[-0.32,-0.25],rl:[0.32,0.25],paper:0},
};
function lerpPose(a,b,k){const o={};for(const key of['la','ra','ll','rl'])o[key]=[lerp(a[key][0],b[key][0],k),lerp(a[key][1],b[key][1],k)];o.paper=lerp(a.paper,b.paper,k);return o;}
function figure(x,y,pose,o={}){ // y = ground at feet
  if((o.s??1)<0.15)return;
  const sc=o.s??1;ctx.save();ctx.translate(x,y);if(o.rot)ctx.rotate(o.rot);ctx.scale(sc,sc);const seed=o.seed??100;
  const hip=[0,-112],neck=[0,-226],sh=[0,-212],head=[0,-264];
  const seg=(p,a,L)=>[p[0]+Math.sin(a)*L,p[1]+Math.cos(a)*L];
  const limb=(p,ang,L1,L2,sd)=>{const m=seg(p,ang[0],L1),e=seg(m,ang[1],L2);strokePts(wob([p,m,e],sd,0.8),1,LW/sc*1.05);return e;};
  circ(head[0],head[1],38,{seed:seed,fill:BG,w:LW/sc*1.05});
  line(neck[0],neck[1],hip[0],hip[1],seed+1,1,LW/sc*1.05);
  limb(hip,pose.ll,58,56,seed+2);limb(hip,pose.rl,58,56,seed+3);
  limb(sh,pose.la,52,50,seed+4);const hand=limb(sh,pose.ra,52,50,seed+5);
  if(pose.paper>0.5){ctx.save();ctx.translate(hand[0]+6,hand[1]-6);ctx.rotate(0.12);ctx.fillStyle=PAPER;ctx.fillRect(-10,-38,50,68);rect(-10,-38,50,68,seed+6,1,LW*0.8/sc);for(let i=0;i<4;i++)line(-2,-24+i*13,30,-24+i*13,seed+10+i,1,1.4,'#777');ctx.restore();}
  ctx.restore();}
function speech(x,y,s,k,size=40){if(k<=0)return;txt(s,x,y,size,{k});const w=txt(s,-9999,-9999,size);line(x-10,y+size*0.55,x-26,y+size*1.25,77,clamp(k*2),2.6);}
function board(x,y,w,h,k=1,seed=200){ctx.save();ctx.fillStyle='#fdfcff';ctx.globalAlpha=clamp(k*3);ctx.fillRect(x,y,w,h);ctx.restore();rect(x,y,w,h,seed,k,LW+0.4);rect(x+9,y+9,w-18,h-18,seed+4,k,2.2);
  if(k>=1){rect(x-22,y+h,w+44,16,seed+8,1,LW);rect(x+40,y+h-12,60,12,seed+9,1,2.4);rect(x+w-150,y+h-14,46,14,seed+10,1,2.4);rect(x+w-96,y+h-12,58,12,seed+11,1,2.4);}}
